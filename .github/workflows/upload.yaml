
name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        test "$(calcit --version)" = "0.27.0"
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru fix --workflow strict --verify --format edn
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-public \
          --ns app.comp.container --ns app.comp.group-line \
          --ns app.comp.sidebar --ns app.comp.task \
          --ns app.comp.todolist --ns app.config --ns app.main \
          --ns app.schema --ns app.updater \
          --summary-only --format json
        calcit calcit.cirru analyze check-types --summary-only --format json
        calcit calcit.cirru analyze weak-types \
          --only schema-dynamic,code-dynamic --intent unresolved \
          --summary-only --format json
        calcit calcit.cirru analyze deprecated --summary-only --format json
        calcit calcit.cirru analyze dynamic-methods

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build web assets with CDN URLs
      run: |
        set -euo pipefail
        yarn compile-page
        yarn release-page

    - name: Check COS credentials
      id: cos-credentials
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
          else
            echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
            exit 1
          fi
        fi

    - name: Upload and verify static assets on COS
      if: steps.cos-credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Install verified rsync
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error \
          --output "$RUNNER_TEMP/rsync.tar.gz" \
          https://download.samba.org/pub/rsync/src/rsync-3.5.0.tar.gz
        echo "c7ffd1ef653e99540f661e47cb00b7f9cad1ee6b972399b16f93d672656e0d33  $RUNNER_TEMP/rsync.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/rsync.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/rsync-3.5.0"
        ./configure --prefix="$RUNNER_TEMP/rsync-install" --disable-acl-support --disable-lz4 --disable-openssl --disable-xattr-support --disable-xxhash --disable-zstd
        make -j2
        make install
        echo "$RUNNER_TEMP/rsync-install/bin" >> "$GITHUB_PATH"

    - name: Configure verified SSH host
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        printf '%s\n' 'tiye.me ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfDrFyoH0+6TL2+xhosnON6f0+/m9Iz8ydJLWMQQzsm' > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"

    - name: Deploy web assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        rsync -avzr --progress \
          -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
          dist/* "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"
